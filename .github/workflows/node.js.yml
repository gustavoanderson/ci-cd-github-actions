name: Teste CI - Cypress e Playwright

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
    - name: Instalar Dependencias
      run: npm install
    - name: Executar testes
      run: npm test
    - name: Upload dos resultados Allure (Cypress)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-cypress
        path: allure-results
        retention-days: 1

  playwright:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
    - name: Instalar Dependencias
      run: npm ci
    - name: Instalar navegadores do Playwright
      run: npx playwright install --with-deps chromium
    - name: Executar testes
      run: npm run test:playwright
    - name: Upload do relatório nativo do Playwright
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload dos resultados Allure (Playwright)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-playwright
        path: allure-results
        retention-days: 1

  publish-report:
    needs: [cypress, playwright]
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
    - name: Instalar Dependencias
      run: npm install
    - name: Baixar resultados de ambas as suítes
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: allure-results
        merge-multiple: true
    - name: Gerar relatório Allure unificado
      run: npm run report:generate
    - name: Publicar relatório no Github Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
